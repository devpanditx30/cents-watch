name: CEnT-S watcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cents-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check calendar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 cents_watcher.py
      - name: Save state
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add cents_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -X theirs origin main && git push)
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -H "Priority: urgent" -d "CEnT-S watcher FAILED - check GitHub Actions" "ntfy.sh/$NTFY_TOPIC"
